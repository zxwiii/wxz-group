name: Clean Inactive Zero Trust Users

on:
  schedule:
    # 每天北京时间早上 8:00 (UTC 00:00) 自动执行
    - cron: '0 0 * * *'
  # 支持在 GitHub Actions 页面随时手动点击运行测试
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Inactive User Cleanup Robot
        env:
          CF_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python scripts/cleanup_inactive_users.py
