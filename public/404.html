<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 页面未找到 - 王小治课题组</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #06152d radial-gradient(circle at 50% 35%, #0d274c 0%, #051329 100%) no-repeat;
      color: #ffffff;
      overflow-x: hidden;
    }
    
    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 36px 20px 24px;
      position: relative;
    }

    /* 顶部 Logo 区域 */
    .header-logo {
      text-align: center;
      padding: 10px 0;
    }
    .header-logo a {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none !important;
      color: #ffffff;
    }
    .brand-badge {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #0284c7 0%, #1e3a8a 100%);
      color: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      font-family: "Georgia", serif;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4);
    }
    .brand-text {
      text-align: left;
    }
    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    .brand-sub {
      font-size: 12px;
      color: #94a3b8;
    }

    /* 404 主体内容 */
    .content-container {
      text-align: center;
      max-width: 680px;
      width: 100%;
      margin: auto 0;
    }

    /* 404 巨型渐变艺术字 */
    .code-404 {
      font-size: 170px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #38bdf8 0%, #0e8faa 50%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 40px rgba(14, 143, 170, 0.35);
      margin-bottom: 12px;
      user-select: none;
    }

    .title-message {
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .sub-message {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto 36px;
    }

    /* 操作按钮组 */
    .action-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 38px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #0e8faa 0%, #0284c7 100%);
      color: #ffffff !important;
      text-decoration: none !important;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(14, 143, 170, 0.4);
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
    }
    .btn-home:hover {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      box-shadow: 0 6px 20px rgba(14, 143, 170, 0.6);
      transform: translateY(-2px);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0 !important;
      text-decoration: none !important;
      font-size: 15px;
      font-weight: 500;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff !important;
      transform: translateY(-2px);
    }

    /* 快捷学术链接 */
    .quick-links {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .quick-links span {
      font-size: 14px;
      color: #64748b;
    }
    .quick-links a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .quick-links a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }
    .quick-links .sep {
      color: #475569;
    }

    /* 底部版权信息 */
    .footer-copy {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      padding: 15px 0 6px 0;
    }

    @media screen and (max-width: 600px) {
      .code-404 {
        font-size: 110px;
      }
      .title-message {
        font-size: 20px;
      }
      .sub-message {
        font-size: 14px;
        margin-bottom: 28px;
      }
      .btn-home, .btn-back {
        width: 100%;
        max-width: 260px;
      }
      .quick-links {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <!-- 顶部独立 Logo -->
    <div class="header-logo">
      <a href="/">
        <div class="brand-badge">W</div>
        <div class="brand-text">
          <div class="brand-name">王小治课题组</div>
          <div class="brand-sub">扬州大学环境科学与工程学院</div>
        </div>
      </a>
    </div>

    <!-- 404 主体核心 -->
    <div class="content-container">
      <h1 class="code-404">404</h1>
      <h2 class="title-message">抱歉，您访问的页面已迷航或不存在</h2>
      <p class="sub-message">
        Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>

      <div class="action-buttons">
        <a href="/" class="btn-home">
          <svg style="width:18px;height:18px;fill:currentColor;" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
          </svg>
          返回课题组首页
        </a>
        <button type="button" onclick="history.back()" class="btn-back">
          <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
          </svg>
          返回上一页
        </button>
      </div>

      <div class="quick-links">
        <span>您可能想要访问：</span>
        <a href="/">首页概况</a>
        <span class="sep">·</span>
        <a href="/research">研究方向</a>
        <span class="sep">·</span>
        <a href="/publications">学术文章</a>
        <span class="sep">·</span>
        <a href="/patents">专利成果</a>
        <span class="sep">·</span>
        <a href="/members">团队成员</a>
        <span class="sep">·</span>
        <a href="/contact">联系我们</a>
      </div>
    </div>

    <!-- 底部独立版权声明 -->
    <div class="footer-copy">
      © 2005-2026 王小治课题组 (Prof. Xiaozhi Wang's Lab) · All Rights Reserved
    </div>
  </div>
</body>
</html>
